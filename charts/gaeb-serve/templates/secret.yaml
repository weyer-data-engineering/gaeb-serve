{{- if and (not .Values.apiKey.existingSecret) (not .Values.apiKey.value) }}
{{- fail "Set apiKey.existingSecret or apiKey.value: gaeb-serve does not start without an API key." }}
{{- end }}
{{- if not .Values.apiKey.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gaeb-serve.fullname" . }}
  labels:
    {{- include "gaeb-serve.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.apiKey.secretKey }}: {{ .Values.apiKey.value | quote }}
{{- end }}
